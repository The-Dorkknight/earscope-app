# Builds the Android APK on GitHub's servers.
#
#  * Every push / pull request: builds an APK you can download from the run's
#    "Artifacts" section (handy for testing).
#  * Pushing a tag like v0.2.0: also publishes a GitHub Release with the APK
#    and a SHA-256 checksum attached.
#
# Signing: if the ANDROID_KEYSTORE_BASE64 secret is set (see README), release
# APKs are signed with YOUR key, so people can install updates over the top.
# Without it you get a debug-signed APK, which works but uses a throwaway key.

name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write      # needed only to create Releases on tag pushes

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Install Briefcase
        run: pip install "briefcase==0.4.5"

      - name: Use tag as version (v1.2.3 -> 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['tool']['briefcase']['version'])")
          if [ -n "$KEYSTORE_B64" ]; then FORMAT=apk; else FORMAT=debug-apk; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FORMAT=$FORMAT"   >> "$GITHUB_ENV"
          briefcase package android -p "$FORMAT" --no-input

      - name: Sign release APK with your key
        if: env.FORMAT == 'apk'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS:      ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:    ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:     ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls dist/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "out/EarViolator4000-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/EarViolator4000-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect debug APK
        if: env.FORMAT == 'debug-apk'
        run: |
          mkdir -p out
          cp "$(ls dist/*.apk | head -1)" "out/EarViolator4000-$VERSION-debug.apk"

      - name: Checksum
        run: cd out && sha256sum *.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EarViolator4000-${{ env.VERSION }}
          path: out/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
