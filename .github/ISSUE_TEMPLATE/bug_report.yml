name: Bug report
description: The picture doesn't appear, or something misbehaves
body:
  - type: input
    id: version
    attributes: {label: App version, description: "Shown in the header as 'Rev x.y.z'", placeholder: "1.0.0"}
    validations: {required: true}
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android app, Windows, macOS, Linux, Other]
    validations: {required: true}
  - type: input
    id: scope
    attributes: {label: Scope WiFi name and where you bought it, placeholder: "HNDEC-1234, eBay"}
  - type: textarea
    id: what
    attributes: {label: What happened?, description: What you expected and what you saw}
    validations: {required: true}
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Open Log, press Run diagnostics, press Copy, and paste here.
      render: text
    validations: {required: true}
